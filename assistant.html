<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assistant | UPWISE</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>try{var t=localStorage.getItem("upwise-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</head>
<body class="chat" hidden>
<header class="site-header"><div class="wrap">
<a class="brand" href="app.html">UPWISE</a>
<div class="actions" style="margin-left:auto">
<button id="new" class="btn ghost small" type="button">New chat</button>
<button id="hist" class="btn ghost small" type="button">History</button>
</div></div></header>
<main class="chat-log" id="log" aria-live="polite"></main>
<form id="chat-form" class="chat-form">
<textarea id="input" rows="1" maxlength="4000" placeholder="Ask anything" aria-label="Message"></textarea>
<button id="send" class="btn primary" type="submit">Send</button>
</form>
<p class="fine">UPWISE can make mistakes. Check important information with official sources.</p>
<aside class="drawer" id="drawer" aria-label="Chat history">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
<h2 style="font-size:22px;margin:0">History</h2>
<button id="close" class="icon-btn" type="button" aria-label="Close history">&#10005;</button>
</div>
<div id="convs"></div>
</aside>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="auth.js"></script>
<script src="assistant.js"></script>
</body>
</html>
