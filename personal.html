<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Personal upgrade | UPWISE</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>try{var t=localStorage.getItem("upwise-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</head>
<body hidden>
<header class="site-header"><div class="wrap">
<a class="brand" href="app.html">UPWISE</a>
<div class="actions" style="margin-left:auto"><a class="btn ghost small" href="app.html">Dashboard</a></div>
</div></header>
<main class="page">
<h1>Personal upgrade</h1>
<p class="muted">Small steps count. Steady beats perfect.</p>
<div class="tabs" role="tablist">
<button id="tab-goals" type="button" role="tab" aria-selected="true">Goals</button>
<button id="tab-habits" type="button" role="tab" aria-selected="false">Habits</button>
</div>
<p id="msg" class="form-msg" role="status"></p>
<section id="pane-goals">
<form id="goal-form" class="inline-form">
<input id="goal-title" class="field" type="text" maxlength="100" placeholder="A goal you want to reach" aria-label="Goal title">
<label class="date-label">Target date (optional)<input id="goal-date" class="field" type="date"></label>
<button class="btn primary small" type="submit">Add goal</button>
</form>
<div id="goal-list"></div>
</section>
<section id="pane-habits" hidden>
<form id="habit-form" class="inline-form">
<input id="habit-title" class="field" type="text" maxlength="80" placeholder="A habit to build" aria-label="Habit name">
<button class="btn primary small" type="submit">Add habit</button>
</form>
<div id="habit-list"></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="auth.js"></script>
<script src="personal.js"></script>
</body>
</html>
