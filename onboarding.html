<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Set up | UPWISE</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>try{var t=localStorage.getItem("upwise-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</head>
<body hidden>
<main class="auth">
<a class="brand" href="app.html">UPWISE</a>
<div class="auth-card wide">
<h1>Set up your space</h1>
<p class="muted" style="margin:0">Takes a minute. You can change it later.</p>
<form id="onboard-form" novalidate>
<label>Name<input id="fullname" type="text" maxlength="60" autocomplete="name"></label>
<fieldset><legend>What are you interested in?</legend><div class="interests" id="interests"></div></fieldset>
<label>Country<select id="country"></select></label>
<label>Time zone<select id="timezone"></select></label>
<p id="msg" class="form-msg" role="status"></p>
<button id="submit" class="btn primary" type="submit">Save and continue</button>
</form>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
</body>
</html>
