<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I'm Stuck | UPWISE</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>try{var t=localStorage.getItem("upwise-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</head>
<body hidden>
<header class="site-header"><div class="wrap">
<a class="brand" href="app.html">UPWISE</a>
<div class="actions" style="margin-left:auto"><a class="btn ghost small" href="app.html">Dashboard</a></div>
</div></header>
<main class="page">
<h1>I&rsquo;m Stuck</h1>
<p class="muted">Not sure where to begin? Describe your situation and get options, a recommendation and a plan you can save.</p>
<p class="meta">Try an example:</p>
<div class="starters" id="examples" style="margin-bottom:16px"></div>
<form id="stuck-form">
<label class="stack">What&rsquo;s going on?
<textarea id="situation" class="field" rows="5" maxlength="2000" placeholder="Tell it like you would to a friend. The more detail, the better the plan."></textarea></label>
<p class="meta" id="count">0 / 2000</p>
<button id="go" class="btn primary" type="submit">Help me get unstuck</button>
</form>
<p id="msg" class="form-msg" role="status"></p>
<div id="result" hidden>
<div id="sections"></div>
<div class="card-actions" style="margin:14px 0">
<button id="save" class="btn primary small" type="button">Save this plan</button>
<button id="again" class="btn ghost small" type="button">Start over</button>
</div>
<p class="meta">This is guidance, not professional advice. Check important facts with official sources.</p>
</div>
<h2 style="font-size:24px;margin-top:34px">Saved plans</h2>
<div id="plans"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="auth.js"></script>
<script src="stuck.js"></script>
</body>
</html>
